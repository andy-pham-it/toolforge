name: CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check (node -c)
        run: find packages -name '*.js' -not -path '*/node_modules/*' -exec node -c {} +
      - run: npm test --workspaces
